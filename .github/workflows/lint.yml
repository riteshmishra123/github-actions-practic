name: Auto Linter

on:
  push:
    paths: "*.py"
jobs:
  code-linting:
    runs-on: ubuntu-latest
    # this steps will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linter
        run: pip install ruff
      - name: Check the files for linting
        run: ruff check .
        
